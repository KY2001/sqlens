name: format
on: 
  push:
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
      - name: Install the project
        run: uv sync
      - run: make format
      - name: Check for diffs
        run: git diff --exit-code
